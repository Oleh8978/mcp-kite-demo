stages:
  - lint
  - test
  - eval-gate

image: python:3.12

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

cache:
  key: uv-$CI_COMMIT_REF_SLUG
  paths:
    - .uv-cache/

before_script:
  - pip install uv
  - uv sync --extra dev

lint:
  stage: lint
  script:
    - uv run ruff check src tests
    - uv run ruff format src tests --check

test:
  stage: test
  script:
    - uv run pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

eval-gate:
  stage: eval-gate
  script:
    - uv run kite-eval-gate --offline --min-composite 0.70
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
