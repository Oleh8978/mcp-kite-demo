[project]
name = "mcp-kite-demo"
version = "0.1.0"
description = "Self-improving MCP agent with a deterministic eval harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Oleh Mykhailovskyi" }]
dependencies = [
    "mcp>=1.2.0,<2",
    "ollama>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
kite-agent = "kite_agent.cli:main"
kite-search = "kite_agent.search:main"
kite-eval-gate = "kite_agent.eval_gate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kite_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
